# LocalGate 样例配置
#
# 使用方式：
#   cp localgate.example.yaml localgate.yaml
#
# 该模板默认只监听本机、关闭动态托管，并且不包含任何真实凭证。
# 对外暴露前，请至少检查 http_auth、admin、root 和命令白名单。

# LocalGate 控制面 listener。
bind: "127.0.0.1:3737"
max_concurrency: 4
default_timeout_ms: 600000
max_output_bytes: 10485760

# 任务、事件、审批、部署记录等运行数据的存储目录。
# 已结束任务及其事件日志固定保留 48 小时，并每小时清理一次。
log_store: "./.localgate"

admin:
  enabled: true
  bind: "127.0.0.1:3739"
  base_url: "http://127.0.0.1:3739"
  approval:
    enabled: true
    default_ttl_seconds: 600
    # 同步工具调用产生审批后，先等待该时长。窗口内批准会继续执行原 Task 并直接返回结果。
    # 设为 0 可恢复立即返回 pending_approval 的行为。
    pending_wait_seconds: 5
    max_sync_wait_seconds: 30
    rules:
      - id: allow-read-only
        effect: allow
        tools:
          - read_file
          - get_startup_instructions
          - get_skill
          - task_status
          - task_logs
          - task_result
          - wait_task_finish
        risk: low

      - id: approve-write-and-shell
        effect: require_approval
        tools:
          - write_file
          - apply_patch
          - run_command
          - run_argv
          - exec_command
          - write_stdin
          - close_session
          - upload_file
        risk: high

      - id: approve-deployment
        effect: require_approval
        tools:
          - deploy_tool
          - delete_deployment
          - start_deployment
          - stop_deployment
          - restart_deployment
          - rollback_deployment
        risk: critical

# 对外暴露控制面时应开启。
# bearer_token 建议通过 LOCALGATE_HTTP_BEARER_TOKEN 环境变量注入，
# 不要把真实 token 写入配置文件或提交到 Git。
http_auth:
  enabled: false
  bearer_token: ""
  allow_paths:
    - /healthz

session_cleanup:
  finished_ttl_seconds: 1800
  idle_ttl_seconds: 1800
  max_sessions: 100
  sweep_interval_ms: 60000

subagents:
  # Subagent Runtime 默认关闭；启用 browser provider 前先确保 opencli 可执行且 Chrome 已登录对应站点。
  enabled: false
  default_provider: "opencli_chatgpt"
  max_agents: 32
  max_concurrency: 4
  max_pending_per_agent: 8
  same_agent_poll_interval_seconds: 10
  different_agent_poll_interval_seconds: 5
  providers:
    opencli_chatgpt:
      enabled: true
      executable: "opencli"
      timeout_seconds: 120
      # 同一 provider 的 spawn/send 提交冷却时间；0 表示关闭。
      submit_interval_seconds: 0
      # 建议填写一个专用 ChatGPT Project ID 或 /g/g-p-... URL，避免 subagent 会话散落在普通聊天列表。
      default_project: ""
    # 可同时启用 Gemini；保持 default_provider=opencli_chatgpt 时，可在 subagent_spawn 中显式 provider=opencli_gemini。
    opencli_gemini:
      enabled: false
      # Gemini 的 DOM adapter 随 LocalGate 内置；这里只配置它调用的通用 OpenCLI browser backend。
      browser_executable: "opencli"
      # 未在 subagent_spawn.model 显式覆盖时使用的 Gemini 模型/模式。
      default_model: "Pro"
      # 可选：仅用于开发/兼容场景，覆盖 LocalGate 内置的 Gemini adapter runner。
      # executable: "/path/to/custom-adapter"
      timeout_seconds: 120
      # 同一 Gemini provider 的所有 spawn/send 至少间隔这么多秒；0 表示关闭。
      submit_interval_seconds: 0

# 将当前模型自行压缩后的上下文交接到一个新的普通 ChatGPT 会话。
# 该能力不创建 LocalGate subagent；成功后用户直接打开返回的 conversation URL 继续。
# 当前仅支持 opencli_chatgpt，并复用上方 subagents.providers.opencli_chatgpt 的 executable、
# timeout 和 submit interval 配置，即使 subagents.enabled=false 也可单独启用。
# 未显式传 project 时始终创建顶层普通会话，不继承 Subagent 的 default_project。
conversation_handoff:
  enabled: false
  provider: "opencli_chatgpt"

# 可选：显式配置共享 Skill 根目录。每项必须是绝对路径。
# 这些目录会先于自动发现的 ~/.agents/skills 和 <root>/.agents/skills 扫描；
# 重复路径（包括解析后指向同一目录的 symlink）只扫描一次，同名 Skill 只保留第一次命中的版本。
skills:
  global_roots: []

# 一个 LocalGate 实例只允许访问一个 root。建议替换为明确的绝对路径。
root: "."

# 仅允许实际需要的命令。生产环境不要使用 "*"。
command_allowlist:
  - echo
  - pwd
  - ls
  - cat
  - rg
  - git
  - go
command_denylist: []

# 可用于屏蔽 root 内不应访问的绝对路径。
path_denylist: []

# 仅允许传入明确需要的环境变量。LocalGate 会始终继承服务进程 PATH；
# 只有需要允许请求覆盖 PATH 时，才应把 PATH 放进 env_allowlist。
env_allowlist:
  - HOME
  - TMPDIR

# Shell 高风险语法默认关闭。
allow_shell_pipe: false
allow_shell_redirect: false
allow_shell_control: false
allow_shell_background: false
allow_shell_substitution: false

# 命中这些命令或写入路径时触发实例级审批策略。
approval_policy:
  commands: []
  write_paths: []

http:
  base_url: "http://127.0.0.1:3737"
  allow_cors: false
  allowed_origins: []

# 将 root 内文件以短期 MCP resource_link 返回给 ChatGPT / Agent。
# 首版要求 base_url 与 http.base_url 使用相同的 scheme 和 authority。
file_exports:
  enabled: false
  base_url: "http://127.0.0.1:3737"
  default_ttl_seconds: 300
  max_ttl_seconds: 600
  max_file_bytes: 104857600
  require_approval: false

# Admin Console 文件浏览器。首版只读浏览 API 已可用；写入能力后续接入审批和审计。
file_browser:
  enabled: true
  read_only: false
  max_file_bytes: 1048576
  max_upload_bytes: 104857600
  show_hidden_files: false
  exclude:
    - ".git"
    - "node_modules"
    - ".localgate"
  require_approval_for_write: true
  require_approval_for_delete: true

# Bark 旁路通知和模型 send_notification 工具。
# 所有消息固定使用 active 通知级别。启用加密时，完整 Bark JSON 会先使用
# AES-128/192/256-CBC + PKCS#7 加密，再把 ciphertext 和 iv 发给 Bark。
# device_key、encryption_key 和 encryption_iv 直接写在本地 localgate.yaml 中；
# localgate.yaml 不应提交到版本库。
notifications:
  enabled: false
  system_enabled: true
  tool_enabled: true
  bark:
    base_url: "https://api.day.app"
    device_key: ""
    # 留空表示发送明文 Bark 参数。Key 必须是 16、24 或 32 字节。
    encryption_key: ""
    # AES-CBC IV 固定为 16 字节，并需与 Bark App 中的加密配置一致。
    encryption_iv: ""

deployments:
  # public/private 应用面使用独立 listener。
  public_bind: "127.0.0.1:3738"
  private_bind: "127.0.0.1:3740"

  public_base_url: "https://apps.example.com"
  private_base_url: "https://private-apps.example.com"
  default_access: "private"

  reserved_names:
    - localgate
    - control
    - www
    - api
    - admin
    - mcp
    - tasks
    - approvals
    - static
    - deploys

  static:
    # 直接拼接到静态 deployment 名称后。
    # docs + site => docssite.apps.example.com；配置为 "-site" 可得到 docs-site.apps.example.com。
    domain_suffix: ""
    max_files: 10000
    max_total_bytes: 52428800
    max_file_bytes: 52428800
    require_approval: true

  dynamic:
    enabled: false
    require_approval: true

    # 直接拼接到动态 deployment 名称后。
    # api + app => apiapp.apps.example.com。
    domain_suffix: ""

    allowed_executables:
      - "/absolute/path/to/node"
      - "/absolute/path/to/python3"

    env_allowlist:
      - NODE_ENV
      - APP_ENV
      - PYTHONPATH

    max_apps: 20
    max_files: 20000
    max_total_bytes: 536870912
    max_file_bytes: 104857600

    startup_timeout_seconds: 20
    shutdown_timeout_seconds: 5
    restart_policy: "on-failure"
    restart_max_attempts: 3
    restart_backoff_seconds: 2
    restart_reset_seconds: 60

    max_log_bytes: 10485760
    max_log_files: 3
    release_retention: 3

    max_request_body_bytes: 33554432
    max_request_header_bytes: 1048576
    max_concurrent_requests: 100
    upstream_header_timeout_seconds: 30
    max_response_header_bytes: 1048576

mcp_http:
  stateless: true

tool_arguments:
  enable_base64: false

# 开启后可通过临时访问令牌调用 HTTP Tool API。
tool_http_mode:
  enabled: false
  access_token_ttl_seconds: 600

# 可选的下游 MCP stdio 服务。
mcp_servers: []

# 示例：
# mcp_servers:
#   - name: "example_mcp"
#     command: "/absolute/path/to/mcp-server"
#     args:
#       - "--stdio"
#     cwd: "/absolute/path/to/workdir"
#     env:
#       EXAMPLE_ENV: "non-sensitive-value"

# 以下内容只通过环境变量配置，不写入 YAML：
#   LOCALGATE_HTTP_BEARER_TOKEN
#   LOCALGATE_UPGRADE_TOKEN
